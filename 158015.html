<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>최도현 전화투표</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #eef8ff;
}

.wrap {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 10px;
}

.dohyun {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 18px;
}

.call {
    display: block;
    width: 100%;
    height: auto;
    margin-top: 12px;
    border-radius: 18px;
}

a {
    display: block;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="wrap">

    <img class="dohyun"
         src="dohyun.jpg"
         alt="최도현">

    <a href="tel:158015">
        <img class="call"
             src="call.png"
             alt="전화 투표 바로 연결">
    </a>

</div>

</body>
</html>
