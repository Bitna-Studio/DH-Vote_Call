<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>최도현 1번 전화투표</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #eef8ff;
    text-align: center;
    font-family: "Malgun Gothic", sans-serif;
}

.wrap {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    padding: 8px;
}

.poster {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 18px;
}

.call {
    width: 100%;
    height: auto;
    display: block;
    margin-top: 12px;
    border-radius: 18px;
}

a {
    display: block;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="wrap">
    <img class="poster" src="158011.png" alt="최도현 1번 전화투표">

    <a href="tel:158011">
        <img class="call" src="call.png" alt="투표 전화 바로 연결하기">
    </a>
</div>

</body>
</html>
